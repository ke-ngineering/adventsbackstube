<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventsbackstube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<header>
  <div>
    <h1>Adventsbackstube</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="hud">
    <button class="btn round snd" id="snd" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="stars" id="stars" aria-label="Gesammelte Sterne">★ 0</div>
  </div>
</header>

<section id="hub" class="hub" aria-label="Stationen"></section>

<section id="game" hidden>
  <div class="levelbar">
    <button class="btn back" id="back" aria-label="Zur Backstube">‹ Backstube</button>
    <button class="btn round" id="prev" aria-label="Vorheriges Level">‹</button>
    <span id="lvl">Level 1</span>
    <button class="btn round" id="next" aria-label="Nächstes Level">›</button>
  </div>
  <main>
    <div id="stage" class="stage"></div>
    <div class="controls" id="controls"></div>
    <div class="legend" id="legend"></div>
  </main>
</section>

<footer>Prototyp <span id="ver"></span> · <span id="status"></span></footer>

<div class="overlay" id="help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="dialog help">
    <h2 id="helpTitle"></h2>
    <div id="helpBody"></div>
    <button class="btn red" id="helpOk">Verstanden</button>
  </div>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="dialog">
    <h2 id="winTitle">Geschafft!</h2>
    <div class="big" id="winStars"></div>
    <div id="winText"></div>
    <div class="song" id="song"></div>
    <div class="tip"><b>Backstuben-Tipp</b><span id="tip"></span></div>
    <div class="dlg-btns">
      <button class="btn" id="toHub">Backstube</button>
      <button class="btn red" id="go">Nächstes Level</button>
    </div>
  </div>
</div>

<script src="js/core.js?v=13"></script>
<script src="js/regal.js?v=13"></script>
<script src="js/blech.js?v=13"></script>
<script src="js/spritz.js?v=13"></script>
<script src="js/buch.js?v=13"></script>
<script src="js/app.js?v=13"></script>
</body>
</html>
