<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventsbackstube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, verspielt, gemütlich – eine Backstube am Adventsabend
   IDEA: ein Küchenregal voller Vorratsgläser, die man einräumt
   PICTURE: Fliesenwand mit zwei Holzborden, Gläser mit Zutatenschichten; volle Gläser bekommen Karodeckel + Etikett
   COLOUR and TYPE: Butterfliesen / Nussholz / Weihnachtsrot; nachts Pflaumenblau mit Lampenschein. Fredoka rund.
   LAYOUT: kleiner Kopf, großes Regal mittig, Knöpfe darunter, Zutatenleiste unten */
:root{color-scheme:light dark;
  --bg:light-dark(#f3dc9c,#231d33);
  --tile:light-dark(rgba(255,255,255,.45),rgba(255,255,255,.05));
  --ink:light-dark(#3b2216,#f6e9d8);
  --soft:light-dark(#7a5440,#c9b7a6);
  --wood:light-dark(#8a5533,#6b4329);
  --woodlight:light-dark(#b27448,#8c5a39);
  --red:#c8283a;
  --card:light-dark(#fff8ea,#2f2742);
  --glass:light-dark(rgba(255,255,255,.42),rgba(255,255,255,.10));
  --rim:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.35));
  --glow:light-dark(rgba(255,240,200,.0),rgba(255,196,110,.20));
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.45 Fredoka,"Trebuchet MS",system-ui,sans-serif;overflow-x:clip;
  background:
   radial-gradient(ellipse 70% 45% at 50% 0,var(--glow),transparent 70%),
   linear-gradient(var(--tile) 2px,transparent 2px) 0 0/44px 44px,
   linear-gradient(90deg,var(--tile) 2px,transparent 2px) 0 0/44px 44px,
   var(--bg);
  display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(4vw,14px) 6px;max-width:760px;width:100%;margin:0 auto}
h1{font-size:clamp(26px,6vw,36px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--soft);font-size:15px;margin-top:2px}
.stars{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.stars b{color:#e0a100}
.levelbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 0}
.levelbar span{font-weight:600;font-size:17px;min-width:7.5em;text-align:center}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px max(3vw,10px);max-width:760px;width:100%;margin:0 auto}
.shelf{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2.2vw,16px);padding:0 10px;margin-top:34px;
  border-bottom:14px solid var(--wood);border-radius:0 0 4px 4px;box-shadow:0 10px 0 -4px rgba(0,0,0,.18);position:relative}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:4px;background:var(--woodlight)}
.jar{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;
  width:clamp(42px,12vw,62px);padding-top:16px;transition:transform .18s ease;-webkit-tap-highlight-color:transparent}
.jar:focus-visible .glass{outline:3px solid var(--red);outline-offset:3px}
.glass{width:100%;height:calc(4 * var(--lh) + 14px);--lh:clamp(24px,7vw,34px);
  background:var(--glass);border:3px solid var(--rim);border-top-width:2px;border-radius:9px 9px 16px 16px;
  display:flex;flex-direction:column-reverse;gap:2px;padding:4px 3px;overflow:hidden;position:relative;
  box-shadow:inset 6px 0 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.10)}
.layer{height:var(--lh);flex:none;border-radius:6px;background-color:var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.22)}
.jar.sel{transform:translateY(-18px)}
.jar.sel .glass{box-shadow:inset 6px 0 0 rgba(255,255,255,.25),0 14px 14px rgba(0,0,0,.22)}
.lid{position:absolute;top:4px;width:112%;height:14px;border-radius:5px;opacity:0;transform:translateY(-14px);
  background:repeating-linear-gradient(90deg,var(--red) 0 6px,#ec8a93 6px 12px);transition:.35s cubic-bezier(.3,1.6,.5,1)}
.jar.done .lid{opacity:1;transform:none}
.tag{position:absolute;bottom:18%;background:#fffaf0;color:#3b2216;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(-4deg);white-space:nowrap;max-width:110%;overflow:hidden;text-overflow:ellipsis}
.jar.pop .glass{animation:pop .3s ease}
.jar.shake{animation:shake .32s ease}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:34px 0 8px}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:44px;padding:8px 18px;border-radius:14px;border:0;cursor:pointer;
  background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:var(--red);color:#fff}
.btn.round{width:44px;padding:0;font-size:20px}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:14px;color:var(--soft);margin:6px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;background-color:var(--c)}
footer{text-align:center;font-size:13px;color:var(--soft);padding:10px 14px 16px}
.overlay{position:fixed;inset:0;background:rgba(40,20,10,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.overlay.on{display:flex}
.dialog{background:var(--card);border-radius:22px;padding:26px 22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.3);animation:rise .35s cubic-bezier(.3,1.5,.5,1)}
.dialog h2{margin:0 0 4px;font-size:28px;line-height:1.1}
.big{font-size:38px;letter-spacing:4px;color:#e0a100;margin:6px 0}
.big .off{color:light-dark(#e6d7bf,#4c4060)}
.tip{background:light-dark(#fbefd6,#3a3150);border-radius:12px;padding:10px 12px;font-size:15px;margin:14px 0 18px;text-align:left}
.tip b{display:block;font-size:13px;color:var(--soft);font-weight:600}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Adventsbackstube</h1>
    <div class="sub">Gewürzregal – sortiere jede Zutat in ihr eigenes Glas</div>
  </div>
  <div class="stars" id="stars" aria-label="Gesammelte Sterne">★ 0</div>
</header>
<div class="levelbar">
  <button class="btn round" id="prev" aria-label="Vorheriges Level">‹</button>
  <span id="lvl">Level 1</span>
  <button class="btn round" id="next" aria-label="Nächstes Level">›</button>
</div>
<main>
  <div id="shelves" aria-live="polite"></div>
  <div class="controls">
    <button class="btn" id="undo">↶ Rückgängig</button>
    <button class="btn" id="restart">Neu starten</button>
  </div>
  <div class="legend" id="legend"></div>
</main>
<footer>Prototyp · Mechanik 1 von 3 · <span id="moves">0 Züge</span></footer>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="dialog">
    <h2 id="winTitle">Regal sortiert!</h2>
    <div class="big" id="winStars"></div>
    <div id="winText"></div>
    <div class="tip"><b>Backstuben-Tipp</b><span id="tip"></span></div>
    <button class="btn red" id="go">Nächstes Glas-Regal</button>
  </div>
</div>

<script>
{
const CAP = 4;
const dots = (c, s = 10) => `radial-gradient(circle at 30% 40%, ${c} 1.4px, transparent 2px) 0 0/${s}px ${s}px`;
const ING = [
  {name:'Kakao',     c:'#5a3420', bg:dots('rgba(255,255,255,.18)', 9)},
  {name:'Kirschen',  c:'#c62f3d', bg:'radial-gradient(circle at 70% 30%, rgba(255,255,255,.35) 2px, transparent 3px) 0 0/16px 14px'},
  {name:'Honig',     c:'#e8a317', bg:'linear-gradient(100deg, transparent 40%, rgba(255,255,255,.35) 46%, transparent 54%)'},
  {name:'Mandeln',   c:'#d8b48a', bg:'radial-gradient(ellipse 4px 2.5px at 50% 50%, #a9794e 90%, transparent) 0 0/13px 11px'},
  {name:'Pistazien', c:'#8fb35a', bg:dots('rgba(40,70,20,.35)', 8)},
  {name:'Zucker',    c:'#fbf7ef', bg:dots('rgba(180,170,150,.6)', 7)},
  {name:'Zimt',      c:'#a8582b', bg:'repeating-linear-gradient(135deg, rgba(0,0,0,.12) 0 3px, transparent 3px 8px)'},
  {name:'Mohn',      c:'#3d4a6b', bg:dots('rgba(255,255,255,.28)', 6)},
  {name:'Orangeat',  c:'#ef7d22', bg:'repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 4px, transparent 4px 10px)'},
];
const TIPS = [
  'Butter für Mürbeteig kalt verarbeiten – dann wird er schön mürbe.',
  'Plätzchenteig vor dem Ausstechen mindestens 30 Minuten kühlen.',
  'Vanillekipferl noch warm in Vanillezucker wälzen, dann haftet er besser.',
  'Zimtsterne bei niedriger Temperatur backen, damit die Eiweißglasur weiß bleibt.',
  'Hart gewordene Lebkuchen werden mit einem Apfelstück in der Dose wieder weich.',
  'Eiweiß wird nur in einer völlig fettfreien Schüssel richtig steif.',
];

/* ---- Spielstand ---- */
const KEY = 'adventsbackstube.v1';
let save = {level:1, best:{}};
try { const st = JSON.parse(localStorage.getItem(KEY)); if (st && st.level) save = Object.assign(save, st); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const totalStars = () => Object.values(save.best).reduce((a, b) => a + b, 0);

/* ---- Regeln ---- */
const top = j => j[j.length - 1];
const full = j => j.length === CAP && j.every(x => x === j[0]);
const solved = s => s.every(j => !j.length || full(j));
const canPour = (s, a, b) => a !== b && s[a].length > 0 && s[b].length < CAP && (!s[b].length || top(s[b]) === top(s[a]));
function pour(s, a, b) { const t = top(s[a]); while (s[a].length && top(s[a]) === t && s[b].length < CAP) s[b].push(s[a].pop()); }

/* ---- Level-Generator mit Lösbarkeitsprüfung ---- */
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; }
const colorsFor = L => Math.min(ING.length, 3 + Math.floor((L - 1) / 3));
function solvable(start) {
  const seen = new Set(); let nodes = 0;
  const key = s => s.map(j => j.join('')).sort().join('|');
  const dfs = s => {
    if (solved(s)) return true;
    if (++nodes > 60000) return false;
    const k = key(s); if (seen.has(k)) return false; seen.add(k);
    for (let a = 0; a < s.length; a++) {
      const A = s[a]; if (!A.length || full(A)) continue;
      const uni = A.every(x => x === A[0]);
      for (let b = 0; b < s.length; b++) {
        if (!canPour(s, a, b) || (uni && !s[b].length)) continue;
        const n = s.map(j => j.slice()); pour(n, a, b);
        if (dfs(n)) return true;
      }
    }
    return false;
  };
  return dfs(start.map(j => j.slice()));
}
function generate(L) {
  const colors = colorsFor(L); let s;
  for (let t = 0; t < 150; t++) {
    const r = rng(L * 7919 + t * 104729 + 13);
    const ids = shuffle([...ING.keys()], r).slice(0, colors);
    const pieces = shuffle(ids.flatMap(i => [i, i, i, i]), r);
    s = [];
    for (let i = 0; i < colors; i++) s.push(pieces.slice(i * CAP, i * CAP + CAP));
    s.push([], []);
    if (s.some(full)) continue;
    if (solvable(s)) return s;
  }
  s.push([]); return s; // Notfall: ein Extraglas macht es sicher lösbar
}

/* ---- Zustand & Darstellung ---- */
const $ = id => document.getElementById(id);
let lvl = Math.min(save.level, 999), start, s, sel = null, hist = [], moves = 0, undos = 0;

function load(L) {
  lvl = L; start = generate(L); s = start.map(j => j.slice());
  sel = null; hist = []; moves = 0; undos = 0; render();
}
function jarHTML(i) {
  const j = s[i], done = full(j);
  const label = j.length ? j.map(x => ING[x].name).join(', ') : 'leer';
  return `<button class="jar${sel === i ? ' sel' : ''}${done ? ' done' : ''}" data-i="${i}" aria-label="Glas ${i + 1}: ${label}">
    <span class="lid"></span>
    <span class="glass">${j.map(x => `<span class="layer" style="--c:${ING[x].c};background-image:none;background:${ING[x].bg},${ING[x].c}"></span>`).join('')}</span>
    ${done ? `<span class="tag">${ING[j[0]].name}</span>` : ''}
  </button>`;
}
function render() {
  const n = s.length, per = n > 6 ? Math.ceil(n / 2) : n, rows = [];
  for (let i = 0; i < n; i += per) rows.push([...Array(Math.min(per, n - i)).keys()].map(k => k + i));
  $('shelves').innerHTML = rows.map(r => `<div class="shelf">${r.map(jarHTML).join('')}</div>`).join('');
  $('lvl').textContent = `Level ${lvl}`;
  $('stars').innerHTML = `<b>★</b> ${totalStars()}`;
  $('prev').disabled = lvl <= 1;
  $('next').disabled = lvl >= save.level;
  $('undo').disabled = !hist.length;
  $('moves').textContent = `${moves} ${moves === 1 ? 'Zug' : 'Züge'}`;
  const used = [...new Set(start.flat())].sort((a, b) => a - b);
  $('legend').innerHTML = used.map(x => `<span><i style="--c:${ING[x].c};background:${ING[x].bg},${ING[x].c}"></i>${ING[x].name}</span>`).join('');
}
const jarEl = i => document.querySelector(`.jar[data-i="${i}"]`);
function flash(i, cls) { const el = jarEl(i); if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

$('shelves').addEventListener('click', e => {
  const b = e.target.closest('.jar'); if (!b) return;
  const i = +b.dataset.i;
  if (sel === null) { if (s[i].length) { sel = i; render(); } return; }
  if (sel === i) { sel = null; render(); return; }
  if (canPour(s, sel, i)) {
    hist.push(s.map(j => j.slice())); pour(s, sel, i); moves++; sel = null; render(); flash(i, 'pop');
    if (solved(s)) setTimeout(win, 500);
  } else if (s[i].length) { sel = i; render(); }
  else { const k = sel; flash(k, 'shake'); }
});
$('undo').addEventListener('click', () => { if (!hist.length) return; s = hist.pop(); undos++; sel = null; render(); });
$('restart').addEventListener('click', () => load(lvl));
$('prev').addEventListener('click', () => lvl > 1 && load(lvl - 1));
$('next').addEventListener('click', () => lvl < save.level && load(lvl + 1));

function win() {
  const stars = undos === 0 ? 3 : undos <= 3 ? 2 : 1;
  save.best[lvl] = Math.max(save.best[lvl] || 0, stars);
  save.level = Math.max(save.level, lvl + 1); persist();
  $('winStars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(3 - stars)}</span>`;
  $('winText').textContent = stars === 3 ? `Perfekt – in ${moves} Zügen ohne Rückgängig.` : `Geschafft in ${moves} Zügen. Ohne Rückgängig gibt’s 3 Sterne.`;
  $('tip').textContent = TIPS[(lvl - 1) % TIPS.length];
  $('win').classList.add('on'); $('go').focus(); render();
}
$('go').addEventListener('click', () => { $('win').classList.remove('on'); load(lvl + 1); });

load(lvl);
}
</script>
</body>
</html>
